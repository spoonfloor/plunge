<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Between these markers is written by dev/configure.mjs from app.config.json. Edit there. -->
<!-- config -->
<title>Plunge</title>
<meta name="apple-mobile-web-app-title" content="Plunge">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<!-- /config -->
<!-- Home Screen: opens as an app. No apple-mobile-web-app-status-bar-style on purpose: on
     iOS 27 “black-translucent” makes iOS blur the top of the screen, and WebKit asks for the
     tag to be removed. iOS colors the status bar from #top-bar instead (see app.css). -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header id="top-bar">
  <div class="top-row">
    <!-- The beach shown; tapping it opens the menu of beaches (app.js fills it). -->
    <h1><button id="spot-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="spot-menu"><span
      id="spot-name">Crissy East</span><span class="chevron" aria-hidden="true"></span></button></h1>
    <button id="refresh" type="button" aria-label="Refresh data"><span id="updated">Loading…</span></button>
  </div>
  <div id="days" role="group" aria-label="Pick a day"></div>
  <div id="spot-menu" role="menu" aria-label="Beaches" hidden></div>
</header>
<div id="spot-scrim" hidden></div>
<main class="first-load">
  <progress id="loader" value="0" aria-hidden="true"></progress>
  <!-- The day shown sits between the days before and after it; app.js fills these. -->
  <div id="pager"><div id="track"></div></div>
  <p id="announce" class="visually-hidden" aria-live="polite"></p>
</main>
</body>
</html>
