<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Between these markers is written by dev/configure.mjs from app.config.json. Edit there. -->
<!-- config -->
<title>Plunge</title>
<meta name="apple-mobile-web-app-title" content="Plunge">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<!-- /config -->
<!-- Home Screen: opens as an app. No apple-mobile-web-app-status-bar-style on purpose: on
     iOS 27 “black-translucent” makes iOS blur the top of the screen, and WebKit asks for the
     tag to be removed. iOS colors the status bar from #top-bar instead (see app.css). -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header id="top-bar">
  <h1>Crissy East</h1>
  <button id="refresh" type="button" aria-label="Refresh data"><span id="updated">Loading…</span></button>
</header>
<main>
  <section id="hero" aria-live="polite">
    <p id="hero-when" class="eyebrow"></p>
    <p id="hero-level" class="level-word"></p>
    <p id="hero-why"></p>
  </section>

  <div id="strip" role="group" aria-label="Pick an hour"></div>

  <p id="summary" class="card"></p>

  <ul id="factors" aria-label="Factors for the selected hour"></ul>

  <section id="advisories" class="factor" aria-label="NWS advisories"></section>
</main>
</body>
</html>
